BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "acme"
BBFILE_PATTERN_acme = "^${LAYERDIR}/"
BBFILE_PRIORITY_acme = "10"
# qt6-layer is intentionally missing from BBLAYERS (diagnostic fixture).
LAYERDEPENDS_acme = "core acme-bsp openembedded-layer:1 qt6-layer"
LAYERSERIES_COMPAT_acme = "scarthgap"
